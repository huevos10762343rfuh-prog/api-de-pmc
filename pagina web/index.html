<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnhk-JbYFBRR5WB0P7Pbb5EZ6FZ6wOdof2PBG9KWU-BA&s=10">
    <title>pmc contratos</title>
</head>
<body>
    <h1>bienvenido a pmc contratos</h1>
    <h2>esta pagina sirve para contratar servicios de fuerzas militares privadas
        o de paises que decidan "prestarlos" bajo contrato.
    </h2>
<!--carrito-->
<button class="carritomexa" type="button">🛒</button>
<dialog class="ventanacarrito">
    <h2>tu carrito</h2>
    <ul class="carrito">

    </ul>
    <button class="cerrarcarrito" type="button">cerrar</button>
</dialog>
<!--añadir objeto -->
    <section>
        <div class="form">
        <form class="form">
            <label>agregar pmc</label>
            <p>completa los campos para poder añadir una pmc al catalogo</p>
            <input type="text" class="nombre" placeholder="nombre">
            <input type="number" class="numero" placeholder="cantidad">
            <input type="text" class="espec" placeholder="espec">
            <input type="text" class="imagen" placeholder="imagen por url">
            <input type="number" class="precio" placeholder="precio">
            <button class="enviar" type="submit">enviar</button>
        </form>
        </div>
    </section>
<!--lista con imagenes de todos los productos-->
<section>
<h2>lista de pmc completas</h2>
<div>
<ul class="lista"></ul>
</div>
</section>
<script src="main.js"></script>
</body>
</html>
