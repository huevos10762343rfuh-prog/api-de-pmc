<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnhk-JbYFBRR5WB0P7Pbb5EZ6FZ6wOdof2PBG9KWU-BA&s=10">
    <title>pmc contratos</title>
</head>
<body>
    <h1>bienvenido a pmc contratos</h1>
    <h2>esta pagina sirve para contratar servicios de fuerzas militares privadas
        o de paises que decidan "prestarlos" bajo contrato.
    </h2>
    <section>
        <div class="form">
        <form action="" method="post">
            <label>agregar pmc</label>
            <p>completa los campos para poder añadir una pmc al catalogo</p>
            <input type="text" placeholder="nombre">
            <input type="number" placeholder="cantidad">
            <input type="text" placeholder="espec">
            <input type="text" placeholder="imagen por url">
            <input type="number" placeholder="precio">
            <button type="submit">enviar</button>
        </form>
        </div>
    </section>
<!--display del carrusel-->
    <section>
        <h1>algunos de nuestros contratos
            mas seleccionados
        </h1>
    </section>
<div class="carrusel" id="carrusel">
  <div class="pista" id="pista"></div>
  <button class="btn ant" id="ant" aria-label="Anterior">&#10094;</button>
  <button class="btn sig" id="sig" aria-label="Siguiente">&#10095;</button>
</div>







<!--lista con imagenes de todos los productos-->
<section>
<h2>lista de pmc completas</h2>
<div class="lista">
<ul>pmc</ul>


<script src="main.js"></script>
</body>
</html>
